# Self-contained Qwen3.5 + TRL SFTTrainer + PEFT LoRA DDP training project.
# Run from this directory: COPYFILE_DISABLE=1 air run --file train.yaml --watch
# AIR requires experiment_name as a Jobs task key. Together with
# mlflow_experiment_directory it resolves to training_config.experiment_path.
experiment_name: air_hackathon_qwen_3_5_trl
mlflow_experiment_directory: /Workspace/Shared

environment:
  # Serverless GPU environment 6: the databricks_ai_v prefix also loads the
  # databricks-ai venv. v6 dropped bitsandbytes, xformers, and unsloth, and
  # Qwen3.5 needs a newer Transformers than v6 bundles; requirements.txt pins
  # both that and the CUDA 13 torch build v6 targets.
  version: 'databricks_ai_v6'
  dependencies:
    - -r requirements.txt

compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100

env_variables:
  DATABRICKS_RUNTIME_VERSION: '15.4'

code_source:
  type: snapshot
  snapshot:
    root_path: .

# AIR runs this command once per node and sets no per-process RANK, so torchrun
# starts one DDP process per GPU. A single process holding every GPU makes the
# Trainer fall back to nn.DataParallel, which crashes Qwen3.5's Gated DeltaNet
# path and reads only rank 0's shards. --standalone fits one node; multi-node
# workloads pass --nnodes=$NUM_NODES --node_rank=$NODE_RANK
# --master_addr=$MASTER_ADDR --master_port=$MASTER_PORT instead.
command: torchrun --standalone --nproc_per_node=gpu $CODE_SOURCE_PATH/train.py

parameters:
  training_config:
    catalog: catalog_sandbox_5nwjwb
    schema: air_hackathon_v2
    project_name: qwen3_5_4b_finetuned
    experiment_path: /Workspace/Shared/air_hackathon_qwen_3_5_trl

    model_name: Qwen/Qwen3.5-4B
    model_weights_path: /Volumes/catalog_sandbox_5nwjwb/air_hackathon/model_weights/qwen3.5-4b
    train_data_path: /Volumes/catalog_sandbox_5nwjwb/air_hackathon_v2/sft_staging/fraud_sft_dataset/split=train
    eval_data_path: /Volumes/catalog_sandbox_5nwjwb/air_hackathon_v2/sft_staging/fraud_sft_dataset/split=eval
    # false reads prompt/assistant_response directly. When true, point these
    # paths at /Volumes/catalog_sandbox_5nwjwb/air_hackathon_v2/training_data/
    # fraud_raw_dataset/split=<train|eval> and convert each rank slice locally.
    convert_sft: false
    # true recursively loads all parquet files for every rank; false assigns
    # shard_id=N directories by N % world_size.
    ignore_partitions: false
    suspicious_amount_threshold: 500.0
    output_dir: /Volumes/catalog_sandbox_5nwjwb/air_hackathon_v2/checkpoints/qwen3_5_4b_finetuned

    max_seq_length: 2048
    max_steps: 10
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 4
    gradient_accumulation_steps: 4
    learning_rate: 2e-4
    warmup_steps: 5
    training_sample_fraction: 0.0001
    eval_sample_size: 200
    # Trainer/MLflow cadence. eval_steps: 1 records held-out loss and custom
    # classification metrics after every optimizer step.
    logging_steps: 1
    eval_steps: 1
    seed: 3407

    lora_r: 16
    lora_alpha: 16
    lora_dropout: 0.0
    # Qwen3.5 is a 3:1 hybrid: only every fourth (Gated Attention) layer has
    # q/k/v/o_proj, so these names adapt those layers plus every layer's MLP.
    # The Gated DeltaNet linear_attn.* projections stay unadapted.
    lora_target_modules:
      - q_proj
      - k_proj
      - v_proj
      - o_proj
      - gate_proj
      - up_proj
      - down_proj

  # Registration merges the adapter into the base checkpoint's composite
  # (vision + text) shape and serves it with vLLM 0.24 from a separate,
  # two-pass serving environment (serving_requirements.txt + OpenCV 4.12).
  deploy_config:
    run_id: ''
    best_run_metric: trainer_train_loss
    best_run_metric_goal: minimize

    uc_model_name: qwen3_5_4b_finetuned
    served_model_name: qwen3_5_4b_finetuned
    serving_requirements_file: serving_requirements.txt

    vllm_dtype: auto
    vllm_max_model_len: 2048
    vllm_gpu_memory_utilization: 0.8

    endpoint_name: qwen3_5_4b_finetuned
    # AI Gateway writes request/response payloads to
    # <catalog>.<schema>.<inference_table_prefix>_payload.
    inference_table_prefix: qwen3_5_4b_finetuned
    endpoint_description: 'Custom LLM endpoint serving the Qwen3.5 4B TRL LoRA fine-tune.'
    # Qwen3.5-4B fits on the documented 1xA10 custom LLM serving tier; the
    # merged checkpoint also carries the ~1 GB idle vision tower. Custom LLM
    # serving does not autoscale between non-zero replica counts during beta.
    serving_workload_type: GPU_MEDIUM
    serving_workload_size: Small
    serving_scale_to_zero: false
